name: Host integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      host_commit:
        description: Exact public host commit SHA for compatibility validation
        required: false
        type: string

permissions:
  contents: read

env:
  HOST_COMMIT: ${{ inputs.host_commit || '29fc0e8552a88787e81d369f9adab27644c47205' }}

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate pinned host commit
        run: |
          if ! [[ "$HOST_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::host_commit must be a full commit SHA"
            exit 1
          fi
      - name: Check out host
        uses: actions/checkout@v4
        with:
          repository: 3yearsZhuang/Aervox-harness
          ref: ${{ env.HOST_COMMIT }}
          path: host
          persist-credentials: false
      - name: Check out collection revision
        uses: actions/checkout@v4
        with:
          path: host/plugins
          persist-credentials: false
      - name: Bind exact collection commit for integration
        working-directory: host
        run: |
          test "$(git rev-parse HEAD)" = "$HOST_COMMIT"
          echo "Host commit: $HOST_COMMIT"
          collection_commit=$(git -C plugins rev-parse HEAD)
          echo "Collection commit: $collection_commit"
          git rm -r --cached --ignore-unmatch -- plugins
          git config --file .gitmodules submodule.plugins.path plugins
          git config --file .gitmodules submodule.plugins.url https://github.com/Aervox-agent/Aervox-plugins.git
          git add .gitmodules
          git update-index --add --cacheinfo "160000,$collection_commit,plugins"
          git submodule update --init -- packages/core reference/deepseek-harness
          git submodule status -- packages/core plugins reference/deepseek-harness
      - uses: jdx/mise-action@v2
        with:
          working_directory: host
      - name: Install frozen host dependencies
        working-directory: host
        run: mise tasks run install
      - name: Verify collection workspace and task coverage
        working-directory: host
        run: |
          mise exec -- node --test plugins/scripts/check-host-workspaces.test.mjs
          mise exec -- node plugins/scripts/check-host-workspaces.mjs
      - name: Install pinned native check components
        working-directory: host
        run: mise tasks run native-toolchain-setup
      - name: Validate collection documentation
        working-directory: host
        run: |
          mise exec -- markdownlint-cli2 --config .markdownlint-cli2.jsonc 'plugins/README.md' 'plugins/SPECIFICATION.md'
          mise exec -- pnpm --filter @aervox/contracts build
          mise exec -- node --test plugins/scripts/check-docs.test.mjs
          mise exec -- node plugins/scripts/check-docs.mjs
      - name: Validate ecosystem standard and release tooling
        working-directory: host
        env:
          COLLECTION_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          mise exec -- pnpm exec turbo run build --filter=@aervox/host-runtime...
          mise exec -- node --test plugins/scripts/ecosystem.test.mjs
          mise exec -- node --test plugins/plugins/*/*/test/*.test.mjs
          if [ -n "$COLLECTION_BASE" ]; then
            git -C plugins fetch origin "$COLLECTION_BASE"
            mise exec -- node plugins/scripts/lint-plugins.mjs --base "$COLLECTION_BASE"
          else
            mise exec -- node plugins/scripts/lint-plugins.mjs
          fi
      - name: Validate host and collection
        working-directory: host
        run: ./aervox ci all
      - name: Audit locked dependencies
        working-directory: host
        run: mise exec -- pnpm check:dependency-audit
